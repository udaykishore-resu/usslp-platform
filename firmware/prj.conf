# Base configuration for the USSLP label.
#
# The overriding constraint is that this device has 1 MB of flash, 256 KB of RAM
# and a coin cell that has to last most of a decade. Almost every line here is
# either buying a subsystem the product needs or switching off something Zephyr
# enables by default that would cost current.

# --- Kernel -----------------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_ISR_STACK_SIZE=1024
CONFIG_IDLE_STACK_SIZE=320
# Tickless idle is not an optimisation here, it is the whole low-power story: a
# periodic tick would wake the CPU 100 times a second forever.
CONFIG_TICKLESS_KERNEL=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
# The RTC keeps time across deep sleep; the high-frequency clock does not run.
CONFIG_CLOCK_CONTROL=y

# --- Power ------------------------------------------------------------------
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
# The FPU stays off. The nRF52840 has one, but enabling it sets CONTROL.FPCA and
# adds 18 words to every exception entry, on a device that takes a radio
# interrupt tens of times a minute for seven years. Everything numeric in this
# firmware is integer or Q16.16; see radio/usslp_route.h.
# CONFIG_FPU is not set

# --- Drivers ----------------------------------------------------------------
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LIS2DH=y
CONFIG_LIS2DH_TRIGGER_GLOBAL_THREAD=y
CONFIG_ADC=y
CONFIG_WATCHDOG=y
CONFIG_HWINFO=y
CONFIG_REBOOT=y

# --- Storage ----------------------------------------------------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# --- Crypto -----------------------------------------------------------------
# PSA Crypto through mbedTLS. Only the two primitives the product needs are
# built in: Ed25519 verification for the price attestation and the OTA image
# signature. SHA-256 is compiled in from src/crypto/usslp_sha256.c rather than
# taken from here, deliberately — see that file for why.
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_PSA_WANT_ALG_PURE_EDDSA=y
CONFIG_PSA_WANT_ECC_TWISTED_EDWARDS_255=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=8192
CONFIG_ENTROPY_GENERATOR=y

# --- Secure key storage -----------------------------------------------------
# The device identity key never leaves the secure image. On the nRF52840 there
# is no TrustZone, so "secure" is the SPU-protected region MCUboot leaves
# read-protected plus the ACL on the identity page; on the nRF5340 and nRF54L
# the same code targets TF-M and the key genuinely never leaves the secure
# world. src/crypto/devcert.c documents which of those this build got.
CONFIG_TRUSTED_STORAGE=y

# --- MCUboot / DFU ----------------------------------------------------------
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_MCUBOOT_IMG_MANAGER=y

# --- Bluetooth --------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="USSLP Label"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_CTLR_TX_PWR_MINUS_8=y

# --- Logging ----------------------------------------------------------------
# Deferred logging with a small buffer. Immediate mode would hold the CPU awake
# through every UART character, and on a production label the backend is the
# RTT ring the field engineer's probe reads, not a UART nobody has wired.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=1024
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_USSLP_LOG_LEVEL_INF=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n

# --- Size -------------------------------------------------------------------
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_ASSERT=y
CONFIG_THREAD_NAME=y
CONFIG_BOOT_BANNER=n
CONFIG_PRINTK=y
CONFIG_CBPRINTF_NANO=y
