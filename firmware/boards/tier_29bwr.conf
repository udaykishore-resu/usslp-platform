# 2.9-inch 296x128 black/white/red: the volume product, on the overwhelming
# majority of shelf edges.
#
# Two ink planes at one bit each: 296*128/8 = 4,736 bytes per plane, 9,472 bytes
# for the pair. That is the single largest RAM allocation in the firmware and it
# is why the framebuffer is packed rather than one byte per pixel like the
# controller's.
CONFIG_USSLP_DISPLAY_TIER=0
CONFIG_USSLP_EINK_PLANE_BYTES=4736
CONFIG_USSLP_EINK_PLANES=2
CONFIG_HEAP_MEM_POOL_SIZE=4096
