# 5.85-inch 600x448 seven-colour ACeP: promotion ends and fresh counters.
#
# Four bits per pixel, 600*448/2 = 134,400 bytes. That does not fit alongside
# everything else in 256 KB, so this tier streams the image to the panel
# controller's own RAM in bands as it arrives from the mesh rather than holding a
# framebuffer; see display/framebuffer.c. It is also why this tier cannot do a
# partial refresh: there is no retained local copy to diff against.
#
# The honest part: at the platform's planning workload of ten changes a day, a
# 15-second waveform at 35 mA is 60 uA on its own and the cell lasts ten months.
# This panel is a mains-powered or low-cadence fitting. The firmware refuses to
# claim otherwise -- app/provision.c reports the projection at commissioning and
# raises device.battery.projection.short if the planogram has put a colour panel
# on a high-churn shelf.
CONFIG_USSLP_DISPLAY_TIER=2
CONFIG_USSLP_EINK_PLANE_BYTES=0
CONFIG_USSLP_EINK_PLANES=0
CONFIG_USSLP_EINK_STREAMING=y
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_USSLP_TELEMETRY_INTERVAL_S=1800
