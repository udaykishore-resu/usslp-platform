# 4.2-inch 400x300 black/white: larger price points and multi-buy messaging.
#
# One plane, 400*300/8 = 15,000 bytes. Bigger than the BWR pair, and the 2 s
# waveform costs a third more charge per refresh, so a 4.2 label on the platform
# planning workload projects 8.1 years against the 2.9's 8.7.
CONFIG_USSLP_DISPLAY_TIER=1
CONFIG_USSLP_EINK_PLANE_BYTES=15000
CONFIG_USSLP_EINK_PLANES=1
CONFIG_HEAP_MEM_POOL_SIZE=4096
