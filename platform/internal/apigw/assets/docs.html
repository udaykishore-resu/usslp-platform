<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USSLP Platform API</title>
<style>
  /* One file, no fetches. The reference has to render on a store's network
     during the incident it is being read about. */
  :root {
    color-scheme: dark light;
    --bg: #0d1117; --panel: #151b23; --line: #262d38;
    --ink: #e6edf3; --dim: #8b98a8; --faint: #5d6b7d;
    --get: #3fb950; --post: #58a6ff; --del: #f85149; --put: #d29922;
    --accent: #58a6ff; --code: #1b222c;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #ffffff; --panel: #f6f8fa; --line: #d5dbe2;
      --ink: #1f2328; --dim: #57606a; --faint: #8c959f; --code: #f0f3f6;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.55 var(--sans); }
  a { color: var(--accent); }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    border-bottom: 1px solid var(--line); padding: 14px 20px;
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .2px; }
  header .ver { font: 11px var(--mono); color: var(--dim); }
  header .spacer { flex: 1; }
  #filter {
    background: var(--panel); border: 1px solid var(--line); color: var(--ink);
    border-radius: 6px; padding: 6px 10px; font: 12px var(--mono); min-width: 220px;
  }
  main { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 0; align-items: start; }
  nav { position: sticky; top: 57px; max-height: calc(100vh - 57px); overflow: auto;
        border-right: 1px solid var(--line); padding: 16px 12px; }
  nav h2 { font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--faint); margin: 14px 0 6px; }
  nav a { display: block; padding: 3px 6px; border-radius: 4px; text-decoration: none;
          color: var(--dim); font-size: 12px; }
  nav a:hover { background: var(--panel); color: var(--ink); }
  section { padding: 20px 24px 60px; max-width: 980px; }
  .intro { white-space: pre-wrap; color: var(--dim); border-left: 2px solid var(--line);
           padding-left: 14px; margin-bottom: 26px; }
  .group h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .12em;
              color: var(--faint); border-bottom: 1px solid var(--line);
              padding-bottom: 6px; margin: 30px 0 12px; }
  .op { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; background: var(--panel); }
  .op > summary { cursor: pointer; padding: 9px 12px; display: flex; gap: 10px;
                  align-items: center; list-style: none; }
  .op > summary::-webkit-details-marker { display: none; }
  .verb { font: 11px/1 var(--mono); font-weight: 700; padding: 4px 7px; border-radius: 4px;
          min-width: 54px; text-align: center; color: #0d1117; }
  .verb.get { background: var(--get); } .verb.post { background: var(--post); }
  .verb.delete { background: var(--del); } .verb.put { background: var(--put); }
  .path { font: 12.5px var(--mono); }
  .sum { color: var(--dim); font-size: 12px; margin-left: auto; text-align: right; }
  .body { padding: 4px 14px 16px; border-top: 1px solid var(--line); }
  .body p { white-space: pre-wrap; }
  .lock { font-size: 11px; color: var(--faint); font-family: var(--mono); }
  table { border-collapse: collapse; width: 100%; margin: 8px 0 4px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line);
           vertical-align: top; font-size: 12.5px; }
  th { color: var(--faint); font-weight: 600; font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; }
  code, .mono { font-family: var(--mono); background: var(--code); padding: 1px 4px; border-radius: 3px; font-size: 12px; }
  .status { font-family: var(--mono); font-weight: 700; }
  .s2 { color: var(--get); } .s4 { color: var(--put); } .s5 { color: var(--del); } .s1 { color: var(--post); }
  footer { color: var(--faint); font-size: 11px; padding: 20px 24px; border-top: 1px solid var(--line); }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } nav { display: none; } .sum { display: none; } }
</style>
</head>
<body>
<header>
  <h1 id="title">USSLP Platform API</h1>
  <span class="ver" id="version"></span>
  <span class="spacer"></span>
  <input id="filter" type="search" placeholder="filter operations…" autocomplete="off" spellcheck="false">
  <a href="/console">console</a>
  <a href="/openapi.json">openapi.json</a>
</header>
<main>
  <nav id="nav"></nav>
  <section>
    <div class="intro" id="intro">Loading /openapi.json…</div>
    <div id="groups"></div>
    <footer id="footer"></footer>
  </section>
</main>
<script>
(function () {
  "use strict";
  var el = function (tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  };
  var VERBS = ["get", "put", "post", "delete", "patch", "options", "head"];

  function resolve(doc, node) {
    // The document uses $ref for shared parameters and responses. Following
    // one level is enough here and avoids shipping a JSON Schema resolver.
    if (node && typeof node.$ref === "string" && node.$ref.indexOf("#/") === 0) {
      var parts = node.$ref.slice(2).split("/"), cur = doc;
      for (var i = 0; i < parts.length; i++) {
        cur = cur && cur[parts[i]];
      }
      return cur || node;
    }
    return node;
  }

  function schemaName(doc, node) {
    if (!node) return "";
    if (node.$ref) return node.$ref.split("/").pop();
    if (node.type === "array" && node.items) return schemaName(doc, node.items) + "[]";
    return node.type || "object";
  }

  function render(doc) {
    document.getElementById("title").textContent = doc.info.title;
    document.getElementById("version").textContent = "v" + doc.info.version + " · OpenAPI " + doc.openapi;
    document.getElementById("intro").textContent = doc.info.description || doc.info.summary || "";
    document.getElementById("footer").textContent =
      Object.keys(doc.paths).length + " paths. Generated from the gateway's own route table; the build fails if the two disagree.";

    var byTag = {};
    Object.keys(doc.paths).sort().forEach(function (path) {
      var item = doc.paths[path];
      VERBS.forEach(function (verb) {
        var op = item[verb];
        if (!op) return;
        var tag = (op.tags && op.tags[0]) || "other";
        (byTag[tag] = byTag[tag] || []).push({ verb: verb, path: path, op: op });
      });
    });

    var order = (doc.tags || []).map(function (t) { return t.name; });
    Object.keys(byTag).forEach(function (t) { if (order.indexOf(t) < 0) order.push(t); });

    var groups = document.getElementById("groups"), nav = document.getElementById("nav");
    order.forEach(function (tag) {
      var ops = byTag[tag];
      if (!ops) return;
      var meta = (doc.tags || []).filter(function (t) { return t.name === tag; })[0];

      var navHead = el("h2", null, tag);
      nav.appendChild(navHead);

      var g = el("div", "group");
      g.id = "tag-" + tag;
      g.appendChild(el("h2", null, tag + (meta && meta.description ? " — " + meta.description : "")));

      ops.forEach(function (entry) {
        var a = el("a", null, entry.verb.toUpperCase() + " " + entry.path);
        a.href = "#op-" + entry.op.operationId;
        nav.appendChild(a);
        g.appendChild(operation(doc, entry));
      });
      groups.appendChild(g);
    });

    document.getElementById("filter").addEventListener("input", function (e) {
      var q = e.target.value.toLowerCase();
      Array.prototype.forEach.call(document.querySelectorAll(".op"), function (n) {
        n.hidden = q !== "" && n.dataset.search.indexOf(q) < 0;
      });
      Array.prototype.forEach.call(document.querySelectorAll(".group"), function (n) {
        n.hidden = n.querySelectorAll(".op:not([hidden])").length === 0;
      });
    });
  }

  function operation(doc, entry) {
    var op = entry.op;
    var d = el("details", "op");
    d.id = "op-" + op.operationId;
    d.dataset.search = (entry.verb + " " + entry.path + " " + op.operationId + " " + (op.summary || "")).toLowerCase();

    var s = el("summary");
    s.appendChild(el("span", "verb " + entry.verb, entry.verb));
    s.appendChild(el("span", "path", entry.path));
    s.appendChild(el("span", "sum", op.summary || ""));
    d.appendChild(s);

    var b = el("div", "body");
    b.appendChild(el("p", null, op.description || op.summary || ""));

    var auth = el("div", "lock");
    auth.textContent = op.security && op.security.length === 0
      ? "no credential required"
      : "operationId " + op.operationId + " · requires a credential (API key, JWT or client certificate)";
    b.appendChild(auth);

    var params = (op.parameters || []).map(function (p) { return resolve(doc, p); });
    if (params.length) {
      b.appendChild(table(["parameter", "in", "required", "description"], params.map(function (p) {
        return [mono(p.name), p["in"], p.required ? "yes" : "no", p.description || ""];
      })));
    }
    if (op.requestBody) {
      var content = op.requestBody.content || {};
      var media = Object.keys(content)[0];
      b.appendChild(table(["request body", "schema", "required"], [[
        media || "application/json",
        mono(schemaName(doc, media ? content[media].schema : null)),
        op.requestBody.required ? "yes" : "no"
      ]]));
    }
    var responses = op.responses || {};
    b.appendChild(table(["status", "description"], Object.keys(responses).map(function (code) {
      var r = resolve(doc, responses[code]);
      var cls = "status s" + (code === "default" ? "5" : code.charAt(0));
      var span = el("span", cls, code);
      return [span, (r && r.description) || ""];
    })));
    d.appendChild(b);
    return d;
  }

  function mono(text) { return el("code", null, text || ""); }

  function table(head, rows) {
    var t = el("table"), thead = el("thead"), tr = el("tr");
    head.forEach(function (h) { tr.appendChild(el("th", null, h)); });
    thead.appendChild(tr);
    t.appendChild(thead);
    var tb = el("tbody");
    rows.forEach(function (cells) {
      var r = el("tr");
      cells.forEach(function (c) {
        var td = el("td");
        if (c && c.nodeType === 1) { td.appendChild(c); } else { td.textContent = c === undefined ? "" : c; }
        r.appendChild(td);
      });
      tb.appendChild(r);
    });
    t.appendChild(tb);
    return t;
  }

  fetch("/openapi.json", { headers: { accept: "application/json" } })
    .then(function (r) {
      if (!r.ok) throw new Error("openapi.json returned " + r.status);
      return r.json();
    })
    .then(render)
    .catch(function (err) {
      document.getElementById("intro").textContent = "Could not load /openapi.json: " + err.message;
    });
})();
</script>
</body>
</html>
