{{- if .Values.externalSecrets.enabled }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- range $secret := default (list) $svc.secrets }}
---
# The chart never templates Secret data.
#
# An ExternalSecret is a *pointer*: the External Secrets Operator reads the
# named key out of the backing store and writes the Kubernetes Secret. That
# means `helm template` of this chart, the rendered manifests in Git, and the
# ArgoCD diff view all contain the path to a credential and never the credential
# — which is what makes GitOps and secret management compatible at all.
#
# dataFrom.extract rather than an explicit key list: the remote value is a JSON
# object whose keys become the Secret's keys, so adding a field to a credential
# is a change in the secret store rather than a chart release.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "usslp.fullname" $ }}-{{ $name }}-{{ $secret.name }}
  labels:
    {{- include "usslp.serviceLabels" (dict "ctx" $ "name" $name "svc" $svc) | nindent 4 }}
  annotations:
    # Wave -5: every credential exists before any pod that mounts it.
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.externalSecrets.secretStoreRef.name }}
    kind: {{ $.Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "usslp.fullname" $ }}-{{ $name }}-{{ $secret.name }}
    creationPolicy: Owner
    # Owner, not Merge: the operator owns the Secret's whole lifetime, so a
    # hand-edited key is reverted on the next refresh rather than silently
    # surviving in a cluster nobody remembers editing.
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          {{- include "usslp.serviceLabels" (dict "ctx" $ "name" $name "svc" $svc) | nindent 10 }}
  dataFrom:
    - extract:
        key: {{ $.Values.externalSecrets.remotePathPrefix }}/{{ $secret.remoteKey }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
