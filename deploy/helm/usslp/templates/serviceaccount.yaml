{{- if .Values.serviceAccount.create }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "usslp.fullname" $ }}-{{ $name }}
  labels:
    {{- include "usslp.serviceLabels" (dict "ctx" $ "name" $name "svc" $svc) | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    {{- with $.Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if $svc.iamRoleArn }}
    # IRSA. One role per service, never one shared role: the OTA service reads
    # the firmware bucket and the Label Service does not, and a shared role
    # makes that distinction unenforceable.
    eks.amazonaws.com/role-arn: {{ $svc.iamRoleArn | quote }}
    eks.amazonaws.com/sts-regional-endpoints: "true"
    {{- end }}
# The token is not mounted by default (serviceAccount.automountServiceAccountToken
# is false). A pod that does not call the API server has no business holding a
# credential for it. The broker StatefulSet opts back in explicitly because its
# cluster discovery reads its own Endpoints.
automountServiceAccountToken: false
{{- end }}
{{- end }}
{{- end }}
{{- if and .Values.serviceAccount.create (index .Values.services "mqtt-broker").enabled }}
---
# EMQX's Kubernetes discovery strategy lists the endpoints of its own headless
# Service. That is the entire permission it needs, and it is scoped to this
# namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "usslp.fullname" . }}-mqtt-broker-discovery
  labels:
    {{- include "usslp.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "usslp.fullname" . }}-mqtt-broker-discovery
  labels:
    {{- include "usslp.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "usslp.fullname" . }}-mqtt-broker-discovery
subjects:
  - kind: ServiceAccount
    name: {{ include "usslp.fullname" . }}-mqtt-broker
    namespace: {{ .Release.Namespace }}
{{- end }}
