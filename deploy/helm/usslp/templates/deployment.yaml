{{- include "usslp.validate" . -}}
{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled (eq (default "Deployment" $svc.kind) "Deployment") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "usslp.fullname" $ }}-{{ $name }}
  labels:
    {{- include "usslp.serviceLabels" (dict "ctx" $ "name" $name "svc" $svc) | nindent 4 }}
  annotations:
    # Services deploy after infrastructure. Wave 0 is the topic job and the
    # broker; services sit at 10 so that no consumer starts before its topics
    # and its broker exist.
    argocd.argoproj.io/sync-wave: "10"
spec:
  # replicas is deliberately absent when an HPA owns the service: leaving it
  # here makes every Helm upgrade reset the replica count to the floor, which
  # is a self-inflicted capacity incident during a deploy at peak.
  {{- if not $svc.hpa.enabled }}
  replicas: {{ $svc.replicas.min }}
  {{- end }}
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      {{- include "usslp.serviceSelectorLabels" (dict "ctx" $ "name" $name) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 0 unavailable, 25% surge. The price path has no headroom to give up
      # during a deploy; paying for extra pods for the length of a rollout is
      # cheaper than a partial fan-out.
      maxUnavailable: 0
      maxSurge: 25%
  template:
    metadata:
      labels:
        {{- include "usslp.serviceLabels" (dict "ctx" $ "name" $name "svc" $svc) | nindent 8 }}
      annotations:
        # Roll the pods when the non-secret configuration changes. Secrets are
        # deliberately excluded: the External Secrets Operator rotates them on
        # its own schedule, and a checksum over a rotating secret would restart
        # every pod in the region every refresh interval.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        {{- if $.Values.istio.enabled }}
        sidecar.istio.io/inject: "true"
        {{- if $.Values.istio.holdApplicationUntilProxyStarts }}
        # Without this the application starts before Envoy is ready and its
        # first outbound connections fail — which, for a service that opens an
        # MQTT session on boot, means a reconnect storm on every rollout.
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
        {{- end }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "usslp.fullname" $ }}-{{ $name }}
      automountServiceAccountToken: {{ $.Values.serviceAccount.automountServiceAccountToken }}
      {{- if $.Values.priorityClasses.create }}
      priorityClassName: {{ $svc.priorityClassName }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $svc.terminationGracePeriodSeconds }}
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "usslp.podSecurityContext" (dict "ctx" $ "svc" $svc) | nindent 8 }}
      topologySpreadConstraints:
        {{- include "usslp.topologySpread" (dict "ctx" $ "name" $name) | nindent 8 }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "usslp.image" (dict "ctx" $ "svc" $svc) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            {{- include "usslp.containerSecurityContext" (dict "ctx" $ "svc" $svc) | nindent 12 }}
          ports:
            {{- range $portName, $portNumber := $svc.ports }}
            - name: {{ $portName }}
              containerPort: {{ $portNumber }}
              protocol: TCP
            {{- end }}
          env:
            {{- include "usslp.env" (dict "ctx" $ "svc" $svc) | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "usslp.fullname" $ }}-{{ $name }}
          {{- include "usslp.probes" (dict "svc" $svc) | nindent 10 }}
          lifecycle:
            {{- include "usslp.lifecycle" . | nindent 12 }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          volumeMounts:
            {{- include "usslp.volumeMounts" (dict "svc" $svc) | nindent 12 }}
      volumes:
        {{- include "usslp.volumes" (dict "ctx" $ "svc" $svc "name" $name) | nindent 8 }}
{{- end }}
{{- end }}
